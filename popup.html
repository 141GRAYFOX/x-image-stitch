<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>X 切图合一</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>▦ X 切图合一</h1><p>打开包含 2～4 张图片的推文，点击图片下方的 <strong>“拼成单图”</strong>，在当前页面浮窗内自动横向无缝拼接。</p><p>无需打开新标签页，支持：</p><ul><li>横向 / 竖向 / 两列网格拼接</li><li>点击两张缩略图交换位置</li><li>整图左转 / 右转 90°，一键还原方向</li><li>原尺寸浏览与 PNG 保存，导出保留旋转方向</li><li>右上角 ×、Esc 或点击遮罩关闭</li></ul><p class="note">安装或更新扩展后，请刷新已打开的 X 网页。图片未加载或被敏感内容遮挡时，先在 X 上展开图片。</p></body></html>
